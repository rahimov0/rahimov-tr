name: Rahimov
options:
  bundleIdPrefix: tr.rahimov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    # Google'ın test kimlikleri; gerçekleri release iş akışında GitHub değişkenlerinden gelir
    GAD_APP_ID: ca-app-pub-3940256099942544~1458002511
    AD_BANNER_ID: ca-app-pub-3940256099942544/2435281174
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 12.0.0
targets:
  Rahimov:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    dependencies:
      - target: RahimovWidgets
      - package: GoogleMobileAds
    entitlements:
      path: App/Rahimov.entitlements
      properties:
        com.apple.security.application-groups: [group.tr.rahimov.app]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rahimov
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en, ru, az]
        UILaunchScreen: {UIColorName: LaunchBg}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: $(GAD_APP_ID)
        AdBannerUnitID: $(AD_BANNER_ID)
        NSUserTrackingUsageDescription: "Size daha uygun reklamlar gösterebilmek için kullanılır. İzin vermezseniz de uygulama aynen çalışır."
        NSLocationWhenInUseUsageDescription: "Bulunduğunuz şehrin hava durumunu ve namaz vakitlerini göstermek için kullanılır."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [tr.rahimov.app.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.rahimov.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  RahimovWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/RahimovWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.tr.rahimov.app]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Rahimov
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.rahimov.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

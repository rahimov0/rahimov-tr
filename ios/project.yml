name: Rahimov
options:
  bundleIdPrefix: tr.rahimov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
targets:
  Rahimov:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    dependencies:
      - target: RahimovWidgets
    entitlements:
      path: App/Rahimov.entitlements
      properties:
        com.apple.security.application-groups: [group.tr.rahimov.app]
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: KROV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en, ru, az]
        UILaunchScreen: {UIColorName: LaunchBg}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Bulunduğunuz şehrin hava durumunu ve namaz vakitlerini göstermek için kullanılır."
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [tr.rahimov.app.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.rahimov.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  RahimovWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/RahimovWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.tr.rahimov.app]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: KROV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: "Widget'ların bulunduğun yerin hava durumunu ve namaz vakitlerini göstermesi için kullanılır."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.rahimov.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
